<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel ZP Grand</title>
  <meta name="description" content="Hotel ZP Grand — Luxury • Comfort • Class. Review us on Google, visit us on Tripadvisor, or check our Instagram profile.">
  
  <!-- Google Fonts: Cinzel (Luxury Serif) & Plus Jakarta Sans (Clean Modern) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="profile-card">
      
      <!-- Hotel ZP Grand Profile Section -->
      <section class="profile-section">
        
        <!-- Hotel Crest / Logo Badge -->
        <div class="profile-avatar-wrapper">
          <img src="image.png" alt="Hotel ZP Grand Logo" class="profile-avatar-img">
        </div>

        <!-- Hotel Name -->
        <h1 class="profile-title">Hotel ZP Grand</h1>

        <!-- Elegant Golden Divider -->
        <div class="profile-divider" aria-hidden="true">
          <span class="divider-line"></span>
          <span class="divider-diamond">&#9670;</span>
          <span class="divider-line"></span>
        </div>
      </section>

      <!-- Three Gold/Brown Ribbon Links -->
      <section class="links-section">
        
        <!-- Link 1: Review Us (Google Review) -->
        <a href="https://g.page/r/CRM9KrWiyTPdEBE/review" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-google-review"
           aria-label="Review Us on Google">
          <div class="link-icon-container">
            <img src="google.svg" alt="Google" class="link-icon">
          </div>
          <span class="link-text">Review Us</span>
        </a>

        <!-- Link 2: Visit us on Tripadvisor -->
        <a href="https://www.tripadvisor.in/Hotel_Review-g1162217-d34656390-Reviews-Hotel_Zp_Grand-Bhilai_Durg_District_Chhattisgarh.html" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-tripadvisor"
           aria-label="Visit us on Tripadvisor">
          <div class="link-icon-container">
            <img src="tripadvisor.svg" alt="Tripadvisor" class="link-icon">
          </div>
          <span class="link-text">Visit us on Tripadvisor</span>
        </a>

        <!-- Link 3: Check Our Instagram Profile -->
        <a href="https://www.instagram.com/hotel.zp.grand" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-instagram"
           aria-label="Check Our Instagram Profile">
          <div class="link-icon-container">
            <img src="instagram.svg" alt="Instagram" class="link-icon">
          </div>
          <span class="link-text">Check Our Instagram Profile</span>
        </a>

      </section>

      <!-- SoberStuds NFC Branding Footer -->
      <footer class="card-footer">
        <a href="https://wa.me/919243334046?text=Hey%20I%20want%20to%20enquire%20about%20tap%20to%20review%20product" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="footer-brand-container"
           aria-label="Enquire about tap to review product on WhatsApp"
           title="Enquire on WhatsApp: Hey I want to enquire about tap to review product">
          <img src="logo.png" alt="SoberStuds" class="footer-full-logo">
        </a>
      </footer>

    </main>
  </div>
</body>
</html>
